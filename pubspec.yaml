name: custom_note_app
description: Cross-platform vector note-taking app (Impeller Metal/Vulkan + GLSL, ML Kit OCR, SQLite FTS5, .cnote ZIP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^10.3.2
  google_mlkit_text_recognition: ^0.13.1
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/paper_grain.frag
